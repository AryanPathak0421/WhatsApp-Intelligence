# Edge proxy: TLS termination, SPA hosting, /api proxy, rate limits, security headers.
# Mounted into the `edge` container. Certificates: /etc/nginx/certs/fullchain.pem and privkey.pem (see docs/DEPLOYMENT.md).
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30s;

  # JSON access log WITHOUT query strings/bodies (query strings can carry search text from chats)
  log_format json escape=json '{"t":"$time_iso8601","ip":"$remote_addr","m":"$request_method","p":"$uri","s":$status,"ms":"$request_time","b":$body_bytes_sent}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;
  limit_req_zone $binary_remote_addr zone=upload:10m rate=6r/m;
  limit_req_status 429;

  upstream backend { server backend:4000; keepalive 16; }

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8080;
    server_name _;
    # plain HTTP only redirects (and serves the ACME challenge if you use certbot webroot)
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # The app loads nothing from third parties (fonts are system fonts); keep it that way.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /usr/share/nginx/html;
    index index.html;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # uploads: large body, strict rate limit
    location ~ ^/api/projects/[^/]+/chat/upload$ {
      limit_req zone=upload burst=3 nodelay;
      client_max_body_size 210m;
      client_body_timeout 120s;
      proxy_request_buffering off;
      include /etc/nginx/proxy_params;
      proxy_pass http://backend;
    }

    location = /api/auth/login   { limit_req zone=login burst=5 nodelay; include /etc/nginx/proxy_params; proxy_pass http://backend; }
    location = /api/auth/refresh { limit_req zone=login burst=10 nodelay; include /etc/nginx/proxy_params; proxy_pass http://backend; }

    # live events (SSE): no buffering, long-lived connection; each user is capped at 5 streams by the backend
    location = /api/events {
      limit_req zone=api burst=10 nodelay;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      include /etc/nginx/proxy_params;
      proxy_pass http://backend;
    }

    # WhatsApp Cloud API webhook: Meta's servers call this; the backend verifies the HMAC over the raw body, so the body must pass through untouched
    location = /api/webhooks/whatsapp {
      limit_req zone=api burst=100 nodelay;
      client_max_body_size 1m;
      include /etc/nginx/proxy_params;
      proxy_pass http://backend;
    }

    location /api/ {
      limit_req zone=api burst=60 nodelay;
      client_max_body_size 1m;
      proxy_read_timeout 120s;
      include /etc/nginx/proxy_params;
      proxy_pass http://backend;
    }

    # the health endpoint is for orchestrators, not the internet
    location = /health { return 404; }

    # hashed build assets can be cached forever; index.html must not be
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { add_header Cache-Control "no-store"; try_files $uri /index.html; }
  }
}
